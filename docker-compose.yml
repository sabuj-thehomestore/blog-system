services:
  mongodb:
    image: mongo:7.0
    container_name: blogsystem-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: blogsystem-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/blogsystem
      - CLIENT_URL=http://localhost:5173
      - JWT_ACCESS_SECRET=production_jwt_access_super_secret_key_32_chars_min
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=production_jwt_refresh_super_secret_key_32_chars_min
      - JWT_REFRESH_EXPIRES_IN=7d
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - FACEBOOK_APP_ID=
      - FACEBOOK_APP_SECRET=
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - blog-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: blogsystem-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
